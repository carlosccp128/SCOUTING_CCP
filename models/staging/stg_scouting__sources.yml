# 

version: 2

sources:
  - name: scouting
    description: >
      Datos crudos de las fuentes de origen, que nos pasa nuestro cliente
      con los que quieren que desarrollemos nuestros modelos.
    
    schema: raw
    database: "{{ env_var('DBT_ENVIRONMENTS','FAIL') }}_BRONZE_SCOUTING"

    quoting:
      database: false
      schema: false
      identifier: false


    tables:

      #----------------------------------------------------------
      # country - Países ligas observadas
      #----------------------------------------------------------
      - name: country
        description: Países en los que se realiza seguimiento a jugadores.
        columns:
          - name: id
            description: >
              ID del pais, coincide con id_league y country_id de la tabla league.
              Lo usaremos de conector entre ligas y países y después lo descartaremos.
            data_type: number
            data_tests:
              - unique
              - not_null

          - name: name
            description: Nombre del país en inglés.
            data_type: varchar
            data_tests:
              - unique
              - not_null


      - name: league
        columns:
          - name: id
            data_type: number
          - name: country_id
            data_type: number
          - name: name
            data_type: varchar

      - name: player
        columns:
          - name: id
            data_type: number
          - name: player_api_id
            data_type: number
          - name: player_name
            data_type: varchar
          - name: player_fifa_api_id
            data_type: number
          - name: birthday
            data_type: timestamp_ntz
          - name: height
            data_type: number
          - name: weight
            data_type: number

      - name: player_attributes
        description: 
        #config: ME ESTÁ DANDO ERROR SI LO PONGO.
        loaded_at_field: date
        freshness:
          warn_after:  {count: 24, period: hour}
          #error_after: {count: 48, period: hour}
        
        columns:
          - name: id
            data_type: number
          - name: player_fifa_api_id
            data_type: number
          - name: player_api_id
            data_type: number
          - name: date
            data_type: timestamp_ntz
          - name: overall_rating
            data_type: number
          - name: potential
            data_type: number
          - name: preferred_foot
            data_type: varchar
          - name: attacking_work_rate
            data_type: varchar
          - name: defensive_work_rate
            data_type: varchar
          - name: crossing
