                    min_value: 1
                    max_value: 99

          - name: gk_reflexes
            description: Reflejos de portero.
            data_type: number
            data_tests:
              - not_null
              - dbt_expectations.expect_column_values_to_be_between:
                  arguments:
                    min_value: 1
                    max_value: 99

