# _int_scouting__models.yml
#=========================================================

version: 2

models:
  #------------------------------------------------------------
  # int_scouting__paises
  #------------------------------------------------------------
  - name: int_scouting__paises
    description: Todos los paises de jugadores o de ligas.
    
    columns:
      - name: id_pais
        data_type: number
        description: id_pais
        data_tests: 
          - unique
          - not_null

      - name: nombre_pais
        data_type: varchar
        description: nombre_pais

      - name: iso_pais
        data_type: varchar
        description: iso_pais

  #------------------------------------------------------------
  # int_scouting__ligas
  #------------------------------------------------------------
  - name: int_scouting__ligas
    description: Ligas de analisis.
    
    columns:
      - name: id_liga
        data_type: varchar
        description: id_liga
        data_tests: 
          - unique
          - not_null

      - name: nombre_liga
        data_type: varchar
        description: nombre_liga

      - name: division_liga
        data_type: number
        description: division_liga

      - name: id_pais
        data_type: number
        description: id_pais
        data_tests:
          - not_null
          - relationships:
                  arguments:
                    field: id_pais
                    to: ref('int_scouting__paises')

  #------------------------------------------------------------
  # int_scouting__equipos
  #------------------------------------------------------------
  - name: int_scouting__equipos
    description: Equipos de analisis
    
    columns:
      - name: id_equipo
        data_type: number
        description: id_equipo
        data_tests: 
          - unique
          - not_null

      - name: nombre_equipo
        data_type: varchar
        description: nombre_equipo

      - name: acronimo_equipo
        data_type: varchar
        description: acronimo_equipo

      - name: id_liga
        data_type: varchar
        description: id_liga

  #------------------------------------------------------------
  # int_scouting__posiciones
  #------------------------------------------------------------
  - name: int_scouting__posiciones
    description: Posiciones de los jugadores.
    
    columns:
      - name: posicion_id
        data_type: number
        description: posicion_id
        data_tests: 
          - unique
          - not_null

      - name: posicion
        data_type: varchar
        description: posicion

      - name: posicion_nombre
        data_type: varchar
        description: posicion_nombre

  #------------------------------------------------------------
  # int_scouting__jugadores
  #------------------------------------------------------------
  - name: int_scouting__jugadores
    description: Jugadores analizados.
    
    columns:
      - name: id_jugador
        data_type: number
        description: id_jugador
        data_tests: 
          - unique
          - not_null

      - name: nombre_jugador
        data_type: varchar
        description: nombre_jugador

      - name: fecha_nacimiento
        data_type: timestamp_ntz
        description: fecha_nacimiento

      - name: altura_cm
        data_type: number
        description: altura_cm

      - name: peso_kg
        data_type: number
        description: peso_kg

      - name: posicion_id
        data_type: number
        description: posicion_id
        data_tests:
          - not_null
          - relationships:
                  arguments:
                    field: posicion_id
                    to: ref('int_scouting__posiciones')

      - name: valor_mercado
        data_type: number
        description: valor_mercado

      - name: salario_semanal
        data_type: number
        description: salario_semanal

      - name: id_equipo
        data_type: number
        description: id_equipo
        data_tests:
          - not_null
          - relationships:
                  arguments:
                    field: id_equipo
                    to: ref('int_scouting__equipos')

      - name: id_liga
        data_type: varchar
        description: id_liga
        data_tests:
          - not_null
          - relationships:
                  arguments:
                    field: id_liga
                    to: ref('int_scouting__ligas')

      - name: id_pais
        data_type: number
        description: id_pais
        data_tests:
          - not_null
          - relationships:
                  arguments:
                    field: id_pais
                    to: ref('int_scouting__paises')

      - name: pierna_habil
        data_type: varchar
        description: pierna_habil

      - name: pierna_mala
        data_type: number
        description: pierna_mala

      - name: filigranas
        data_type: number
        description: filigranas

  #------------------------------------------------------------
  # int_scouting__atributos_jugadores
  #------------------------------------------------------------
  - name: int_scouting__atributos_jugadores
    description: Registros de los atributos de jugadores analizados.
    columns:
      - name: id_jugador
        data_type: number
        description: id_jugador
        data_tests:
          - not_null
          - relationships:
                  arguments:
                    field: id_jugador
                    to: ref('int_scouting__jugadores')

      - name: fecha_actualizacion
        data_type: timestamp_ntz
        description: fecha_actualizacion

      - name: valoracion_general
        data_type: number
        description: valoracion_general

      - name: potencial
        data_type: number
        description: potencial

      - name: pierna_habil
        data_type: varchar
        description: pierna_habil

      - name: trabajo_defensivo
        data_type: varchar
        description: trabajo_defensivo

      - name: trabajo_ofensivo
        data_type: varchar
        description: trabajo_ofensivo

      - name: centros
        data_type: number
        description: centros

      - name: definicion
        data_type: number
        description: definicion

      - name: precision_cabeza
        data_type: number
        description: precision_cabeza

      - name: pases_cortos
        data_type: number
        description: pases_cortos

      - name: voleas
        data_type: number
        description: voleas

      - name: regates
        data_type: number
        description: regates

      - name: efecto
        data_type: number
        description: efecto

      - name: precision_faltas
        data_type: number
        description: precision_faltas

      - name: pases_largos
        data_type: number
        description: pases_largos

      - name: control_balon
        data_type: number
        description: control_balon

      - name: aceleracion
        data_type: number
        description: aceleracion

      - name: velocidad
        data_type: number
        description: velocidad

      - name: agilidad
        data_type: number
        description: agilidad

      - name: reflejos
        data_type: number
        description: reflejos

      - name: equilibrio
        data_type: number
        description: equilibrio

      - name: potencia_tiro
        data_type: number
        description: potencia_tiro

      - name: salto
        data_type: number
        description: salto

      - name: resistencia
        data_type: number
        description: resistencia

      - name: fuerza
        data_type: number
        description: fuerza

      - name: tiros_lejanos
        data_type: number
        description: tiros_lejanos

      - name: agresividad
        data_type: number
        description: agresividad

      - name: intercepciones
        data_type: number
        description: intercepciones

      - name: posicion_ataque
        data_type: number
        description: posicion_ataque

      - name: vision
        data_type: number
        description: vision

      - name: penaltis
        data_type: number
        description: penaltis

      - name: marcaje
        data_type: number
        description: marcaje

      - name: robos
        data_type: number
        description: robos

      - name: entrada_agresiva
        data_type: number
        description: entrada_agresiva

      - name: estirada
        data_type: number
        description: estirada

      - name: paradas
        data_type: number
        description: paradas

      - name: saques
        data_type: number
        description: saques

      - name: colocacion
        data_type: number
        description: colocacion

      - name: reflejos_portero
        data_type: number
        description: reflejos_portero