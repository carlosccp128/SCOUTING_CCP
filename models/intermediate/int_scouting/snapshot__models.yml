# _snapshot__models.yml
# ====================

version: 2

models:
  #------------------------------------------------------------
  # snp_evolucion
  #------------------------------------------------------------
  - name: snp_evolucion
    description: "Snapshot de la evolución histórica de los jugadores, registrando los cambios en valoración general y potencial a lo largo del tiempo mediante SCD tipo 2."
    columns:
      - name: id_jugador
        data_type: number
        description: "Identificador único del jugador. Clave foránea que referencia la tabla de jugadores."

      - name: fecha_actualizacion
        data_type: timestamp_ntz
        description: "Fecha y hora en que se registró la actualización de los datos del jugador."

      - name: valoracion_general
        data_type: number
        description: "Valoración general del jugador en el momento de la actualización (escala 0-99)."

      - name: potencial
        data_type: number
        description: "Potencial máximo estimado del jugador en el momento de la actualización (escala 0-99)."

      - name: dbt_scd_id
        data_type: varchar
        description: "Identificador único del registro SCD generado por dbt. Hash que identifica de forma unívoca cada versión del registro."

      - name: dbt_updated_at
        data_type: timestamp_ntz
        description: "Timestamp interno de dbt que indica cuándo fue procesado o actualizado el registro por última vez."

      - name: dbt_valid_from
        data_type: timestamp_ntz
        description: "Timestamp que indica el inicio de la vigencia del registro. Marca el momento desde el que esta versión del dato es válida."

      - name: dbt_valid_to
        data_type: timestamp_ntz
        description: "Timestamp que indica el fin de la vigencia del registro. Es NULL si el registro es la versión actualmente activa."